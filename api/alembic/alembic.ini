# Alembic configuration for the Creator Distribution Platform API.
#
# The database URL is not stored here. It is read from the environment
# (DATABASE_URL) in alembic/env.py so no credential ever reaches version
# control.
#
# This file lives inside the migrations directory. Alembic discovers it
# through the ALEMBIC_CONFIG environment variable, which the container sets to
# /app/alembic/alembic.ini, so `alembic upgrade head` works from /app.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
