# Local development stack for the Creator Distribution Platform.
#
#   docker compose up -d --build db api
#   docker compose exec -T api alembic upgrade head
#   docker compose exec -T api python -m app.seed_demo
#
# No service in this file reaches a paid or third-party provider.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cdp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cdp}
      POSTGRES_DB: ${POSTGRES_DB:-cdp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cdp} -d ${POSTGRES_DB:-cdp}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    container_name: cdp-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cdp}:${POSTGRES_PASSWORD:-cdp}@db:5432/${POSTGRES_DB:-cdp}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8888,http://127.0.0.1:8888}
      DRAFT_PREVIEW_TOKEN: ${DRAFT_PREVIEW_TOKEN:-}
      DEMO_CREATOR_SLUG: ${DEMO_CREATOR_SLUG:-demo}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
